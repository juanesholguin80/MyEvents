# Docker Compose único del repositorio: orquesta los servicios pedidos por
# el enunciado (base de datos, backend y frontend) con un solo comando desde
# la raíz del repo. Ver README.md para el detalle de uso.
#
#   docker compose up --build
#
# Para levantar solo backend + db (sin frontend), útil durante desarrollo
# del backend:
#
#   docker compose up --build backend db
#
services:
  db:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-myevents}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-myevents}
      POSTGRES_DB: ${POSTGRES_DB:-myevents}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-myevents} -d ${POSTGRES_DB:-myevents}"]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 5s

  # Base de datos aislada para la suite de tests del backend (pytest). No es
  # necesaria para levantar la aplicación; ver backend/README.md.
  db_test:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${TEST_POSTGRES_USER:-myevents_test}
      POSTGRES_PASSWORD: ${TEST_POSTGRES_PASSWORD:-myevents_test}
      POSTGRES_DB: ${TEST_POSTGRES_DB:-myevents_test}
    ports:
      - "5433:5432"
    tmpfs:
      - /var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${TEST_POSTGRES_USER:-myevents_test} -d ${TEST_POSTGRES_DB:-myevents_test}"]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 5s

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    restart: unless-stopped
    environment:
      DATABASE_URL: ${DATABASE_URL:-postgresql+psycopg2://myevents:myevents@db:5432/myevents}
      JWT_SECRET_KEY: ${JWT_SECRET_KEY:-change-me}
      JWT_ALGORITHM: ${JWT_ALGORITHM:-HS256}
      ACCESS_TOKEN_EXPIRE_MINUTES: ${ACCESS_TOKEN_EXPIRE_MINUTES:-30}
      REFRESH_TOKEN_EXPIRE_DAYS: ${REFRESH_TOKEN_EXPIRE_DAYS:-7}
    ports:
      - "8000:8000"
    volumes:
      - ./backend/app:/app/app
      - ./backend/alembic:/app/alembic
    depends_on:
      db:
        condition: service_healthy
    # El healthcheck se toma del HEALTHCHECK definido en backend/Dockerfile
    # (contra GET /health); "frontend" depende de esta condición más abajo.

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    restart: unless-stopped
    ports:
      - "80:80"
    depends_on:
      backend:
        condition: service_healthy

volumes:
  postgres_data:
