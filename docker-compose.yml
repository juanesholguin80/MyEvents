# Docker Compose de ENTREGA/DEMO full-stack.
#
# Vive dentro de frontend/ (no a nivel de repo) para que todo el entregable
# del frontend quede autocontenido en esta carpeta. Por eso el contexto de
# build de "backend" apunta a "../backend" (un nivel arriba): solo LEE esos
# archivos para construir la imagen, no los modifica ni los copia.
#
# No reemplaza a backend/docker-compose.yml (que incluye además "db_test",
# usado por el flujo de desarrollo/test aislado del backend) ni lo modifica
# — este es un archivo nuevo, pensado solo para levantar los tres servicios
# que pide el enunciado (backend, frontend, base de datos) con un solo
# comando desde esta carpeta:
#
#   docker compose up --build
#
# El servicio "db" reutiliza tal cual la definición ya verificada de
# backend/docker-compose.yml (mismas variables de entorno con los mismos
# valores por defecto, mismo healthcheck). "backend" se construye con la
# imagen ya existente de backend/Dockerfile (no se modifica ese archivo).
# "frontend" se construye con el Dockerfile de esta misma carpeta (Fase 10,
# stage de build con Node + stage de runtime con Nginx) y depende de que
# "backend" esté saludable antes de arrancar.
services:
  db:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-myevents}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-myevents}
      POSTGRES_DB: ${POSTGRES_DB:-myevents}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-myevents} -d ${POSTGRES_DB:-myevents}"]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 5s

  backend:
    build:
      context: ../backend
      dockerfile: Dockerfile
    restart: unless-stopped
    environment:
      DATABASE_URL: ${DATABASE_URL:-postgresql+psycopg2://myevents:myevents@db:5432/myevents}
      JWT_SECRET_KEY: ${JWT_SECRET_KEY:-change-me}
      JWT_ALGORITHM: ${JWT_ALGORITHM:-HS256}
      ACCESS_TOKEN_EXPIRE_MINUTES: ${ACCESS_TOKEN_EXPIRE_MINUTES:-30}
      REFRESH_TOKEN_EXPIRE_DAYS: ${REFRESH_TOKEN_EXPIRE_DAYS:-7}
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
    # healthcheck propio de ESTE compose: imprescindible porque "frontend"
    # (más abajo) declara "depends_on: backend: condition:
    # service_healthy", y esa condición requiere que el servicio tenga un
    # healthcheck resuelto (de la imagen o del propio compose).
    #
    # Nota: backend/Dockerfile ya define su propio HEALTHCHECK (verificado
    # leyendo el archivo), pero usa Python (`urllib.request`) en vez de
    # curl — deliberadamente, porque la imagen base `python:3.12-slim` NO
    # trae `curl` instalado (verificado con
    # `docker run --rm python:3.12-slim sh -c "which curl"` → vacío). Se
    # replica aquí la misma estrategia (Python, garantizado presente en la
    # imagen porque es el propio intérprete que corre la app) contra
    # GET /health en vez de usar `curl -f`, que fallaría siempre por
    # binario inexistente, no por el estado real del backend. No se
    # modifica backend/Dockerfile para agregar curl: este healthcheck vive
    # únicamente en este compose.
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://localhost:8000/health').read()",
        ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  frontend:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    ports:
      - "80:80"
    depends_on:
      backend:
        condition: service_healthy

volumes:
  postgres_data:
