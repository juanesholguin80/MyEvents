[project]
name = "myevents"
version = "0.1.0"
description = "Technical test for the company Tusdatos: event management project."
authors = [
    {name = "Your Name",email = "you@example.com"}
]
requires-python = ">=3.12"
dependencies = [
    "fastapi (>=0.143.0,<0.144.0)",
    "uvicorn[standard] (>=0.54.0,<0.55.0)",
    "sqlmodel (>=0.0.48,<0.0.49)",
    "alembic (>=1.20.0,<2.0.0)",
    "psycopg2-binary (>=2.9.13,<3.0.0)",
    "pydantic-settings (>=2.15.0,<3.0.0)",
    "passlib[argon2] (>=1.7.4,<2.0.0)",
    "python-jose[cryptography] (>=3.5.0,<4.0.0)",
    "python-multipart (>=0.0.32,<0.0.33)",
    "email-validator (>=2.3.0,<3.0.0)"
]


[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"

[dependency-groups]
dev = [
    "pytest (>=9.1.1,<10.0.0)",
    "pytest-asyncio (>=1.4.0,<2.0.0)",
    "pytest-cov (>=7.1.0,<8.0.0)",
    "httpx (>=0.28.1,<0.29.0)",
    "faker (>=40.43.0,<41.0.0)",
    "flake8 (>=7.4.1,<8.0.0)",
    "pre-commit (>=4.7.0,<5.0.0)"
]

[tool.poetry]
  package-mode = false

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.coverage.run]
source = ["app"]