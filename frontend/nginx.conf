# Nginx del contenedor "frontend": sirve el SPA ya compilado (dist/) y
# reenvía las llamadas de API al servicio "backend" de la red interna de
# docker-compose. Esto resuelve CORS sin tocar backend/ (el backend no
# define CORSMiddleware): el navegador solo ve el origen del frontend
# (http://localhost:80), nunca habla directo con el backend.
server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # --- Proxy de API -------------------------------------------------
    # El backend expone sus rutas bajo /api/v1 (ver app/main.py), todas
    # montadas con prefix="/api/v1". Reenviamos el prefijo completo
    # "/api/" (no solo "/api/v1/") porque el cliente Axios del frontend ya
    # construye sus URLs como "/api/v1/..." (lib/env.ts::apiBaseUrl) — el
    # proxy solo cambia de origen, no de ruta.
    location /api/ {
        proxy_pass http://backend:8000/api/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # --- Assets con hash en el nombre de archivo -----------------------
    # Todo lo que Vite emite bajo /assets/* lleva un hash de contenido en
    # el nombre (p. ej. "index-Z0DBEB-L.css", "EventsListPage-BZGibWfY.js"):
    # si el contenido cambia, el nombre de archivo cambia. Es seguro
    # cachearlos "para siempre" en el navegador — un deploy nuevo nunca
    # reutiliza el mismo nombre de archivo para contenido distinto.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # --- index.html y fallback de SPA ----------------------------------
    # index.html NUNCA debe quedar cacheado por el navegador: es el único
    # archivo que referencia los nombres con hash de /assets/* vigentes en
    # cada deploy; si el navegador lo cachea, un usuario con una pestaña
    # abierta desde antes del último deploy seguiría pidiendo assets viejos
    # que ya no existen en el servidor.
    #
    # "try_files $uri /index.html" es el fallback de SPA: cualquier ruta
    # que no sea un archivo estático real (p. ej. "/events/42",
    # "/admin/users", recargada directamente o compartida como link) se
    # resuelve devolviendo index.html, y React Router toma el control en
    # el cliente a partir de la URL — sin este fallback, Nginx devolvería
    # 404 para cualquier ruta de React Router distinta de "/".
    location / {
        add_header Cache-Control "no-cache";
        try_files $uri /index.html;
    }
}
